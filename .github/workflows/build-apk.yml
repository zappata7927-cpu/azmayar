name: Build Android APK (آزمـیار)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app (static export, no base path)
        env:
          NEXT_OUTPUT: export
          BUILD_DIST: .next-export
        run: npx next build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Sync Capacitor (copy web assets into Android)
        run: npx cap sync android

      - name: Decode release keystore
        env:
          AZMAYAR_KEYSTORE_BASE64: ${{ secrets.AZMAYAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AZMAYAR_KEYSTORE_BASE64" ]; then
            echo "$AZMAYAR_KEYSTORE_BASE64" | base64 -d > android/app/azmayar.keystore
            echo "Keystore decoded from secret — APK will be signed with the release key"
          else
            echo "No AZMAYAR_KEYSTORE_BASE64 secret — falling back to debug signing"
          fi

      - name: Build release APK
        working-directory: android
        env:
          AZMAYAR_KEYSTORE_FILE: azmayar.keystore
          AZMAYAR_KEYSTORE_PASSWORD: ${{ secrets.AZMAYAR_KEYSTORE_PASSWORD }}
          AZMAYAR_KEY_ALIAS: azmayar
          AZMAYAR_KEY_PASSWORD: ${{ secrets.AZMAYAR_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/Azmayar-v${VERSION}.apk"
          ls -la apk-out
          echo "APK_NAME=Azmayar-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azmayar-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish rolling release (latest-apk)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_FILE: apk-out/${{ env.APK_NAME }}
          VERSION_NUM: ${{ env.APK_VERSION }}
        run: |
          gh release create latest-apk "$APK_FILE" \
            --title "آزمـیار — فایل نصبی اندروید (آخرین نسخه)" \
            --notes "فایل نصبی اندروید اپلیکیشن آموزشی آزمـیار (نسخه ${VERSION_NUM})

          ### روش نصب
          ۱. فایل APK را دانلود کنید
          ۲. روی گوشی اجرا کنید و اجازه نصب از منابع ناشناس را بدهید
          ۳. برنامه آزمـیار را باز کنید — اینترنت لازم نیست، همه داده‌ها آفلاین است

          ### نسخه ۱.۲ — تازه‌ها
          - لوگوی جدید اپلیکیشن + اسپلش‌اسکرین جدید
          - دکمه برگشت گوشی: در هر بخش یک مرحله به عقب برمی‌گردد و پیش از خروج کامل، تایید می‌گیرد
          - ویجت لایتنر با فونت درشت‌تر و اندازه بزرگ‌تر
          - تغییر پکیج اپ به mojtaba.app.lab

          ### نکته مهم نصب
          - چون پکیج اپ تغییر کرده، این نسخه به‌عنوان اپ جدید نصب می‌شود؛ نسخه قبلی را حذف کنید تا دو نسخه اپ کنار هم نباشند.
          - به‌دلیل تغییر پکیج، پیشرفت لایتنر و آزمون از نو شروع می‌شود.

          کافیست همیشه آخرین نسخه را نصب کنید؛ هر بار که ریپو به‌روز شود، این ریلیز جایگزین می‌شود." \
            --prerelease || \
          gh release upload latest-apk "$APK_FILE" --clobber
